services:
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    command: ["sh", "-c", "ERL_AFLAGS= mix deps.get && ERL_AFLAGS= mix deps.compile && exec mix run --no-halt"]
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ERL_AFLAGS=-sname gateway -setcookie trionyx
      - TRI_ONYX_CONNECTOR_TOKEN
      - TRI_ONYX_AGENTS_DIR=/app/workspace/trees/_ro/definitions
      - TRI_ONYX_WORKSPACE_DIR=/app/workspace
      - TRI_ONYX_HOST_ROOT=${PWD}
      # uid/gid the agent containers run as (must match the agent image's
      # HOST_UID/HOST_GID build args) — RepoStore chowns working trees to
      # this owner so agents can write their rw mounts
      - TRI_ONYX_HOST_UID=${TRI_ONYX_HOST_UID:-1000}
      - TRI_ONYX_HOST_GID=${TRI_ONYX_HOST_GID:-1000}
      - CLAUDE_CODE_OAUTH_TOKEN
      # Email connector (optional — set TRI_ONYX_IMAP_HOST in .env to enable)
      - TRI_ONYX_IMAP_HOST
      - TRI_ONYX_IMAP_PORT
      - TRI_ONYX_IMAP_USERNAME
      - TRI_ONYX_IMAP_PASSWORD
      - TRI_ONYX_IMAP_SSL
      - TRI_ONYX_IMAP_POLL_INTERVAL
      - TRI_ONYX_SMTP_HOST
      - TRI_ONYX_SMTP_PORT
      - TRI_ONYX_SMTP_USERNAME
      - TRI_ONYX_SMTP_PASSWORD
      - TRI_ONYX_SMTP_SSL
      - TRI_ONYX_EMAIL_AGENT
      # GitHub connector (optional — set TRI_ONYX_GITHUB_TOKENS in .env to enable)
      - TRI_ONYX_GITHUB_TOKENS
      - TRI_ONYX_GITHUB_BOT_NAME
      - TRI_ONYX_GITHUB_BOT_EMAIL
      # Calendar connector (optional — set TRI_ONYX_CALDAV_URL in .env to enable)
      - TRI_ONYX_CALDAV_URL
      - TRI_ONYX_CALDAV_USERNAME
      - TRI_ONYX_CALDAV_PASSWORD
      - TRI_ONYX_CALDAV_BASE_PATH
      - TRI_ONYX_CALDAV_CALENDARS
      - TRI_ONYX_CALDAV_POLL_INTERVAL
      - TRI_ONYX_CALENDAR_AGENT
    volumes:
      - .:/app
      - /app/_build
      - /app/deps
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - mcp_internal

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      # Read-only: allow GET on container, image, and network endpoints
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      # Block all write operations (POST/DELETE)
      POST: 0
      # Disable other endpoints
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  connector:
    build:
      context: .
      dockerfile: connector.Dockerfile
    restart: unless-stopped
    volumes:
      - ./connector/connector:/app/connector
      - ./secrets/connector-config.yaml:/app/config.yaml
      - ./secrets/connector-data:/data
    env_file:
      - .env
    environment:
      - TRI_ONYX_CONNECTOR_TOKEN
      - MATRIX_ACCESS_TOKEN
    depends_on:
      gateway:
        condition: service_healthy

  # Public MCP entry point for claude.ai custom connectors. The mcp/cloudflared
  # pair live on dedicated networks (see `networks:` at the bottom) so the
  # internet-facing containers can only ever reach each other and the gateway.
  #
  # Behind the `mcp` profile so a plain `docker compose up` is unaffected until
  # the operator has created secrets/mcp-config.yaml and set the two secrets:
  #     docker compose --profile mcp up -d
  # See docs/mcp-server.md.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp.Dockerfile
      args:
        HOST_UID: ${TRI_ONYX_HOST_UID:-1000}
        HOST_GID: ${TRI_ONYX_HOST_GID:-1000}
    restart: unless-stopped
    # Loopback only — the public path is the cloudflared sidecar, which dials
    # out and reaches this container over the compose network.
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./mcp_server/mcp_server:/app/mcp_server:ro
      - ./connector/connector:/app/connector:ro
      - ./secrets/mcp-config.yaml:/app/config.yaml:ro
      - ./secrets/mcp-data:/data
    environment:
      - TRI_ONYX_MCP_CONFIG=/app/config.yaml
      - TRI_ONYX_CONNECTOR_TOKEN
      - MCP_OPERATOR_PASSWORD
      - MCP_PUBLIC_URL
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    # Deliberately NOT on the default network: the only things this container
    # can reach are the tunnel (mcp_edge) and the gateway (mcp_internal).
    networks:
      - mcp_edge
      - mcp_internal
    depends_on:
      gateway:
        condition: service_healthy

  # Cloudflare Tunnel sidecar. Hostname -> service routing (http://mcp:8765) is
  # configured in the Cloudflare dashboard, not here. No published ports: the
  # tunnel is outbound-only.
  #
  # Isolated on mcp_edge so a dashboard routing typo cannot publish anything
  # except the MCP server — gateway:4000 (unauthenticated webhooks) and
  # frontend:8080 (DEBUG=1) are unreachable from this container.
  cloudflared:
    profiles: ["mcp"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_METRICS=127.0.0.1:2000
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mcp_edge
    depends_on:
      - mcp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./frontend:/app
    environment:
      - GATEWAY_URL=http://gateway:4000
      - GATEWAY_EXTERNAL_URL=http://localhost:4000
      - DEBUG=1
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default:
  # cloudflared <-> mcp only: the blast radius of a Cloudflare dashboard
  # routing mistake is limited to the (OAuth-protected) MCP server.
  mcp_edge:
  # mcp <-> gateway connector WebSocket. Internal: no outbound NAT needed.
  mcp_internal:
    internal: true
