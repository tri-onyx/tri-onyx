<div id="chat-messages" class="chat-messages" role="log" aria-label="Chat messages"></div>
<form class="prompt-bar"
      hx-post="{% url 'agent-prompt' name=agent.name %}"
      hx-target="#chat-messages"
      hx-swap="beforeend">
  <textarea name="content"
            class="prompt-input"
            placeholder="Send a message..."
            rows="1"
            autocomplete="off"
            aria-label="Message"></textarea>
  <button type="submit" class="btn btn-send">Send</button>
</form>
<script>
(function() {
  var config = document.getElementById('sse-config');
  if (config) {
    config.dataset.isActive = 'true';
    config.dataset.sseUrl = '{{ gateway_sse_url }}';
  }
  var dot = document.querySelector('.status-dot');
  if (dot) {
    dot.className = 'status-dot active';
  }
  document.dispatchEvent(new Event('agent-started'));
})();
</script>
