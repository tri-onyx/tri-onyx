{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TriOnyx{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 30,28 2,28' fill='%2358a6ff' opacity='0.9'/><polygon points='16,10 24,26 8,26' fill='%230d1117'/><polygon points='16,16 20,24 12,24' fill='%2358a6ff' opacity='0.6'/></svg>">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <meta name="color-scheme" content="dark">
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="nav">
    <a href="{% url 'dashboard' %}" class="nav-brand">TriOnyx</a>
    <div class="nav-links">
      <a href="{% url 'dashboard' %}" class="{% block nav_dashboard %}{% endblock %}">Dashboard</a>
      <a href="{% url 'builder-new' %}" class="{% block nav_builder %}{% endblock %}">Builder</a>
      <a href="{% url 'graph' %}" class="{% block nav_graph %}{% endblock %}">Graph</a>
    </div>
    <div class="notif-wrapper">
      <button class="notif-bell" onclick="toggleNotifDropdown()" id="notif-bell" aria-label="Notifications" aria-expanded="false" aria-controls="notif-dropdown">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
        </svg>
        <span id="notif-badge-container"
              hx-get="/approvals/badge"
              hx-trigger="load, every 15s, badge-refresh from:body"
              hx-swap="innerHTML">
          {% if pending_approvals %}
            <span class="notif-badge">{{ pending_approvals }}</span>
            <span class="notif-dot"></span>
          {% endif %}
        </span>
      </button>
      <div class="notif-dropdown" id="notif-dropdown" role="menu" aria-label="Pending Approvals">
        <div class="notif-dropdown-header">Pending Approvals</div>
        <div class="notif-dropdown-body"
             id="notif-dropdown-body"
             hx-get="/approvals/dropdown"
             hx-trigger="notif-refresh from:body"
             hx-swap="innerHTML">
        </div>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  function toggleNotifDropdown() {
    var dd = document.getElementById('notif-dropdown');
    var bell = document.getElementById('notif-bell');
    var open = dd.classList.toggle('open');
    bell.setAttribute('aria-expanded', open);
    if (open) {
      htmx.trigger(document.body, 'notif-refresh');
    }
  }
  document.addEventListener('click', function(e) {
    var wrapper = document.querySelector('.notif-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('notif-dropdown').classList.remove('open');
      document.getElementById('notif-bell').setAttribute('aria-expanded', 'false');
    }
  });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
